<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Candy Clicker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="balance">
        <img class="coin-img" src="/assets/coin.png" alt="" width="28" height="28" />
        <span id="coins">0</span>
      </div>
      <div class="stats">
        <span id="power" class="stat-pill">⚡ 1</span>
        <span id="passive" class="stat-pill">⏱ 0/с</span>
      </div>
    </header>

    <main class="tap-area">
      <div class="glow"></div>
      <div id="float-container"></div>
      <button id="tap-btn" class="tap-btn" aria-label="Tap">
        <img id="tap-img" class="tap-img" src="/assets/clicker.png" alt="tap" draggable="false" />
      </button>
      <p class="hint">Тапай!</p>
    </main>

    <section class="shop" id="shop">
      <div class="shop-tabs">
        <button class="tab active" data-tab="all">Всё</button>
        <button class="tab" data-tab="click">Клики</button>
        <button class="tab" data-tab="passive">Здания</button>
        <button class="tab" data-tab="skin">Скины</button>
      </div>
      <div id="shop-list" class="shop-list"></div>
    </section>
  </div>
  <script src="/game.js"></script>
</body>
</html>
